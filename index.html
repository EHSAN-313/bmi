<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاسبه‌گر BMI</title>
    <!-- فونت وزیر با روش تضمینی -->
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <!-- آیکون‌های Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            font-family: Vazirmatn, -apple-system, sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8f9fa;
            color: #212529;
            line-height: 1.8;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: #fff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #2b2d42;
            font-weight: 700;
            font-size: 1.5rem;
        }

        h1 i {
            margin-left: 10px;
            color: #4361ee;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #4a4e69;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #4361ee;
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 500;
        }

        .btn-calculate {
            background-color: #4361ee;
            color: white;
            margin-top: 0.5rem;
        }

        .btn-calculate:hover {
            background-color: #3a56d4;
            transform: translateY(-2px);
        }

        .btn-doctor {
            background-color: #f72585;
            color: white;
            margin-top: 1.5rem;
        }

        .btn-doctor:hover {
            background-color: #e5177b;
            transform: translateY(-2px);
        }

        #result {
            margin-top: 2rem;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #bmiValue {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 1rem 0;
        }

        #bmiCategory {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem;
            border-radius: 8px;
            background-color: #f8f9fa;
        }

        .hidden {
            display: none;
        }

        /* حالت‌های مختلف BMI */
        .underweight {
            color: #ff9e00;
            background-color: #fff3e0 !important;
        }

        .normal {
            color: #2ecc71;
            background-color: #e8f5e9 !important;
        }

        .overweight {
            color: #e67e22;
            background-color: #fff3e0 !important;
        }

        .obese-1 {
            color: #d35400;
            background-color: #ffebee !important;
        }

        .obese-2 {
            color: #c0392b;
            background-color: #ffebee !important;
        }

        /* رسپانسیو برای موبایل */
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
                border-radius: 12px;
            }
            
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-calculator"></i> محاسبه‌گر شاخص توده بدنی</h1>
        
        <form id="bmiForm">
            <div class="input-group">
                <label for="weight"><i class="fas fa-weight"></i> وزن (کیلوگرم):</label>
                <input type="number" id="weight" placeholder="مثال: 70" min="0" max="200" required>
            </div>
            
            <div class="input-group">
                <label for="height"><i class="fas fa-ruler-vertical"></i> قد (سانتی‌متر):</label>
                <input type="number" id="height" placeholder="مثال: 175" min="0" max="300" required>
            </div>
            
            <button type="submit" class="btn-calculate">
                <i class="fas fa-calculator"></i> محاسبه BMI
            </button>
        </form>
        
        <div id="result" class="hidden">
            <h2><i class="fas fa-chart-line"></i> نتیجه محاسبه:</h2>
            <p id="bmiValue"></p>
            <p id="bmiCategory"></p>
            <button id="doctorBtn" class="btn-doctor hidden">
                <i class="fas fa-calendar-check"></i> رزرو نوبت دکتر تغذیه
            </button>
        </div>
    </div>

    <script>
        document.getElementById('bmiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value) / 100; // تبدیل به متر
            
            if (isNaN(weight) || isNaN(height) || height === 0) {
                alert("لطفاً مقادیر معتبر وارد کنید!");
                return;
            }
            
            const bmi = (weight / (height * height)).toFixed(1);
            
            const resultDiv = document.getElementById('result');
            const bmiValue = document.getElementById('bmiValue');
            const bmiCategory = document.getElementById('bmiCategory');
            const doctorBtn = document.getElementById('doctorBtn');
            
            resultDiv.classList.remove('hidden');
            bmiValue.textContent = `BMI: ${bmi}`;
            
            let category = '';
            let categoryClass = '';
            
            if (bmi < 18.5) {
                category = 'کمبود وزن';
                categoryClass = 'underweight';
                doctorBtn.classList.remove('hidden');
            } else if (bmi >= 18.5 && bmi < 25) {
                category = 'وزن طبیعی';
                categoryClass = 'normal';
                doctorBtn.classList.add('hidden');
            } else if (bmi >= 25 && bmi < 30) {
                category = 'اضافه وزن';
                categoryClass = 'overweight';
                doctorBtn.classList.remove('hidden');
            } else if (bmi >= 30 && bmi < 35) {
                category = 'چاقی درجه ۱';
                categoryClass = 'obese-1';
                doctorBtn.classList.remove('hidden');
            } else {
                category = 'چاقی درجه ۲';
                categoryClass = 'obese-2';
                doctorBtn.classList.remove('hidden');
            }
            
            bmiCategory.textContent = `${category}`;
            bmiCategory.className = categoryClass;
        });

        document.getElementById('doctorBtn').addEventListener('click', function() {
            alert('برای رزرو نوبت دکتر تغذیه، به صفحه پزشکان مراجعه کنید.');
        });
    </script>
</body>
</html>
